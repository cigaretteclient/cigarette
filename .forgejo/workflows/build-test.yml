name: Build Dev

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          github-server-url: "https://git.okr765.com"

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "adopt"

      - name: Set Mod Version
        run: sed -i "s/development_build/${{ github.ref_name }}/" gradle.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Rename JAR
        id: rename
        run: |
          MC_VERSION=$(grep '^minecraft' gradle/libs.versions.toml | head -1 | cut -d '"' -f2)
          JAR=$(ls build/libs/*.jar | grep -v '\-sources\.jar$')
          NEW_NAME="cigarette-${{ github.ref_name }}+${MC_VERSION}.jar"
          mv "$JAR" "build/libs/$NEW_NAME"
          echo "jar-name=$NEW_NAME" >> $GITHUB_OUTPUT

      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: cigarette-artifact
          path: build/libs/${{ steps.rename.outputs.jar-name }}
          retention-days: 30