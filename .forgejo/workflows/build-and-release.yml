name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          github-server-url: "https://git.okr765.com"

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "adopt"

      - name: Set Mod Version
        run: sed -i "s/development_build/${{ github.ref_name }}/" gradle.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Rename and stage JAR
        run: |
          MC_VERSION=$(grep '^minecraft' gradle/libs.versions.toml | head -1 | cut -d '"' -f2)
          JAR=$(ls build/libs/*.jar | grep -v '\-sources\.jar$')
          NEW_NAME="cigarette-${{ github.ref_name }}+${MC_VERSION}.jar"
          mkdir -p dist/release
          mv "$JAR" "dist/release/$NEW_NAME"

      - uses: actions/forgejo-release@v2.7.3
        with:
          direction: upload
          url: https://git.okr765.com
          repo: cigarette/client
          tag: ${{ github.ref_name }}
          title: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          release-dir: dist/release